<!DOCTYPE html>
<html>
<head>
    <title>Test Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Simple Test Form</h2>
        
        {% if prediction_result %}
        <div class="alert alert-success">
            <h4>✅ SUCCESS! Results:</h4>
            <p><strong>Disease:</strong> {{ prediction_result.disease_name }}</p>
            <p><strong>Risk:</strong> {{ prediction_result.overall_risk }}</p>
            <p><strong>Confidence:</strong> {{ prediction_result.confidence }}%</p>
        </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label>Crop Type:</label>
                <select name="crop_type" class="form-control" required>
                    <option value="tomato">Tomato</option>
                    <option value="wheat">Wheat</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Temperature:</label>
                <input type="number" name="temperature" class="form-control" value="28" required>
            </div>
            <div class="mb-3">
                <label>Humidity:</label>
                <input type="number" name="humidity" class="form-control" value="75" required>
            </div>
            <div class="mb-3">
                <label>Rainfall:</label>
                <input type="number" name="rainfall" class="form-control" value="3.5" step="0.1" required>
            </div>
            <div class="mb-3">
                <label>Soil pH:</label>
                <input type="number" name="soil_ph" class="form-control" value="6.5" step="0.1" required>
            </div>
            <div class="mb-3">
                <label>Crop Age:</label>
                <input type="number" name="crop_age_days" class="form-control" value="45" required>
            </div>
            <button type="submit" class="btn btn-success">Test Analysis</button>
        </form>
    </div>
</body>
</html>
