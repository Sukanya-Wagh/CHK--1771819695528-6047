{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .hero-section {
        background-image: url('{% static "hero_bg.png" %}');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        position: relative;
    }
    
    .hero-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1;
    }
</style>

<!-- Hero Section Only -->
<section class="hero-section" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center position-relative z-index-2">
                <h1 class="display-3 fw-bold mb-4" style="text-shadow: 3px 3px 10px rgba(0,0,0,0.8); font-size: 4.5rem; position: relative; z-index: 2;">
                    <i class="fas fa-seedling"></i> Krushirakshak
                </h1>
                <p class="lead mb-5" style="text-shadow: 2px 2px 8px rgba(0,0,0,0.8); font-size: 1.8rem; font-weight: 500; position: relative; z-index: 2;">
                    Your AI Guardian for Smarter Farming
                </p>
                <a href="{% url 'disease_dashboard' %}" class="btn btn-light btn-lg px-5 py-3 position-relative z-index-2" style="font-size: 1.3rem; border-radius: 50px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);">
                    <i class="fas fa-rocket"></i> Get Started
                </a>
                <p class="mt-4" style="text-shadow: 2px 2px 6px rgba(0,0,0,0.8); font-size: 1.1rem; opacity: 0.95; position: relative; z-index: 2;">
                    Powered by <strong>AI Angels</strong>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
